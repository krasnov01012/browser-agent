# Запуск:
#   1. на хосте:  powershell -File scripts/launch_chrome.ps1
#      (порт наружу открывать не надо — см. docs/ADR.md ADR-026)
#   2. здесь:     docker compose up --build
#   3. панель:    http://localhost:8000
#
# Ключи берутся из .env рядом с этим файлом; в образ они не попадают.

services:
  agent:
    build: .
    env_file: .env
    environment:
      CDP_URL: http://host.docker.internal:9222
      UI_HOST: 0.0.0.0
    ports:
      - "8000:8000"
    # На Linux host.docker.internal сам не появляется.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Журналы прогонов и память переживают пересоздание контейнера.
      - ./runs:/app/runs
      - ./memory:/app/memory
    stdin_open: true
    tty: true
