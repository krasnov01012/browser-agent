<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Agent</title>
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --line: #2a2f38;
    --fg: #e6e8ec; --dim: #878e9c;
    --accent: #6ea8fe; --ok: #58c98a; --warn: #e0b054; --err: #e5766f;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  #status { font-size: 12px; color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
  #dot.live { background: var(--ok); }
  #dot.work { background: var(--warn); animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .3 } }

  #log { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .row { padding: 3px 0; display: flex; gap: 10px; align-items: baseline; }
  .row .tag { color: var(--dim); font: 11px var(--mono); min-width: 62px; text-align: right; flex: none; }
  .row .body { min-width: 0; overflow-wrap: anywhere; }
  .step { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--dim); font: 12px var(--mono); }
  .think { color: var(--dim); font-style: italic; }
  .call { color: var(--accent); font-family: var(--mono); font-size: 13px; }
  .res  { color: var(--dim); }
  .err  { color: var(--err); }
  .warn { color: var(--warn); }
  .task { color: var(--fg); font-weight: 600; margin: 8px 0; }

  .done { margin: 18px 0; padding: 14px 16px; border-radius: 8px; background: var(--panel); border-left: 3px solid var(--ok); white-space: pre-wrap; }
  .done.bad { border-left-color: var(--err); }
  .done .meta { margin-top: 10px; color: var(--dim); font: 12px var(--mono); }

  #ask { display: none; margin: 18px 0; padding: 14px 16px; border-radius: 8px; background: var(--panel); border-left: 3px solid var(--warn); }
  #ask.show { display: block; }
  #ask p { margin: 0 0 10px; }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 18px; display: flex; gap: 10px; }
  input, button {
    font: inherit; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); padding: 9px 12px;
  }
  input { flex: 1; }
  input:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: #10141c; border-color: transparent; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--dim); border-color: var(--line); font-weight: 400; }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <h1>Browser Agent</h1>
  <span id="status">подключение…</span>
</header>

<div id="log"></div>

<div id="ask" style="margin: 0 18px">
  <p id="askText"></p>
  <form id="askForm" style="display:flex; gap:10px">
    <input id="askInput" placeholder="Ваш ответ" autocomplete="off">
    <button>Ответить</button>
  </form>
</div>

<footer>
  <form id="taskForm" style="display:flex; gap:10px; flex:1">
    <input id="taskInput" placeholder="Опишите задачу — например: прочитай последние письма и удали спам" autocomplete="off">
    <button id="go">Запустить</button>
  </form>
  <button id="stop" class="ghost" disabled>Стоп</button>
</footer>

<script>
const log = document.getElementById('log');
const dot = document.getElementById('dot');
const status = document.getElementById('status');
const ask = document.getElementById('ask');
const askText = document.getElementById('askText');
const askInput = document.getElementById('askInput');
const go = document.getElementById('go');
const stop = document.getElementById('stop');
const taskInput = document.getElementById('taskInput');

let running = false;

function add(cls, tag, text) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<span class="tag"></span><span class="body"></span>';
  row.children[0].textContent = tag || '';
  row.children[1].textContent = text;
  row.children[1].className = 'body ' + cls;
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

function setRunning(on) {
  running = on;
  go.disabled = on;
  stop.disabled = !on;
  dot.className = on ? 'work' : 'live';
  if (!on) { ask.classList.remove('show'); }
}

const es = new EventSource('/api/events');
es.onopen = () => { dot.className = 'live'; status.textContent = 'готов'; };
es.onerror = () => { dot.className = ''; status.textContent = 'связь потеряна'; };

es.onmessage = (e) => {
  const d = JSON.parse(e.data);
  switch (d.kind) {
    case 'task': {
      const row = add('task', '', '▸ ' + d.text);
      row.querySelector('.tag').textContent = 'задача';
      setRunning(true);
      break;
    }
    case 'step': {
      const line = document.createElement('div');
      line.className = 'step';
      line.textContent = `шаг ${d.index} · ${d.url.slice(0, 80)} · ${d.elements} элементов · ~${d.state_tokens} токенов`;
      log.appendChild(line);
      status.textContent = `шаг ${d.index}`;
      break;
    }
    case 'thought':
      add('think', 'думает', d.text.replace(/\s+/g, ' ').slice(0, 400));
      break;
    case 'tool_call': {
      const args = Object.entries(d.arguments).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(', ');
      add('call', '→', `${d.name}(${args})`);
      break;
    }
    case 'tool_error':
      add('err', '✗', `${d.name}: ${d.kind}`);
      break;
    case 'tool_result':
      if (!d.error) add('res', '←', d.text.replace(/\s+/g, ' ').slice(0, 300));
      break;
    case 'warning':
      add('warn', '!', d.text);
      break;
    case 'question':
      askText.textContent = d.text;
      ask.classList.add('show');
      askInput.focus();
      status.textContent = 'ждёт ответа';
      break;
    case 'answer':
      add('res', 'ответ', d.text);
      ask.classList.remove('show');
      break;
    case 'done': {
      const box = document.createElement('div');
      box.className = 'done' + (d.success ? '' : ' bad');
      const tools = Object.entries(d.tools || {}).map(([k, v]) => `${k}×${v}`).join(', ') || '—';
      const errs = Object.entries(d.errors || {}).map(([k, v]) => `${k}×${v}`).join(', ') || 'нет';
      box.textContent = (d.success ? '✓ ' : '✗ ') + d.summary;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `шагов ${d.steps} · ${d.elapsed} c · токенов ${d.tokens_in}/${d.tokens_out}\nинструменты: ${tools}\nошибки: ${errs}`;
      box.appendChild(meta);
      log.appendChild(box);
      log.scrollTop = log.scrollHeight;
      setRunning(false);
      status.textContent = 'готов';
      break;
    }
    case 'fatal':
      add('err', 'сбой', d.text);
      setRunning(false);
      status.textContent = 'готов';
      break;
  }
};

document.getElementById('taskForm').onsubmit = async (e) => {
  e.preventDefault();
  const task = taskInput.value.trim();
  if (!task || running) return;
  taskInput.value = '';
  const r = await fetch('/api/task', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ task })
  });
  if (!r.ok) add('err', 'сбой', (await r.json()).error || 'не удалось запустить');
};

document.getElementById('askForm').onsubmit = async (e) => {
  e.preventDefault();
  const answer = askInput.value.trim();
  askInput.value = '';
  ask.classList.remove('show');
  await fetch('/api/answer', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ answer })
  });
};

stop.onclick = () => fetch('/api/stop', { method: 'POST' });
taskInput.focus();
</script>
</body>
</html>
