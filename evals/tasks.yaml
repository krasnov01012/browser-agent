# Набор задач для замера качества.
#
# Это внешний тест, а не часть агента: здесь можно называть конкретные сайты,
# потому что сайт задаёт пользователь. Внутрь агента эти знания не попадают
# (docs/CONSTRAINTS.md §2.3).
#
# Поля задачи:
#   id            — короткое имя для отчёта
#   task          — текст, который получает агент; ровно то же, что ввёл бы человек
#   tags          — произвольные ярлыки для фильтрации (--tag)
#   needs_login   — требует залогиненного профиля; такие пропускаются без --with-login
#   max_steps     — потолок шагов именно для этой задачи
#   expect        — что должно быть в итоге
#     success       ожидаемое значение флага успеха
#     mentions      подстроки, которые должны встретиться в отчёте (регистр не важен)
#     forbid_errors виды ошибок, которых быть не должно

tasks:
  - id: navigate
    task: >-
      Открой https://example.com и скажи, что это за страница:
      заголовок и о чём текст.
    tags: [smoke, navigation]
    max_steps: 8
    expect:
      success: true
      mentions: ["example"]
      forbid_errors: [crash, navigation]

  - id: search_and_read
    task: >-
      Зайди на ru.wikipedia.org, найди статью про язык программирования Python
      и назови год, когда вышла первая версия, и имя автора.
    tags: [smoke, extraction, dynamic]
    max_steps: 18
    expect:
      success: true
      mentions: ["1991", "россум"]
      forbid_errors: [crash]

  - id: order_form
    task: >-
      Открой https://httpbin.org/forms/post и оформи заказ пиццы:
      имя «Иван Петров», телефон 79990000000, почта ivan@example.com,
      размер большой, начинка бекон, комментарий «без лука».
      Отправь форму и подтверди, что заказ принят.
    tags: [forms, ordering]
    max_steps: 25
    expect:
      success: true
      mentions: ["иван"]
      forbid_errors: [crash]

  - id: vacancies
    task: >-
      Найди на hh.ru пять вакансий Python-разработчика в Москве с удалённым
      форматом работы. По каждой запиши название, компанию и зарплату.
    tags: [scenario, extraction, dynamic]
    max_steps: 40
    expect:
      success: true
      mentions: ["python"]
      forbid_errors: [crash]

  - id: vacancy_apply
    task: >-
      Найди на hh.ru вакансию Python-разработчика в Москве и откликнись на неё.
      Скажи, на какую вакансию откликнулся и что показала страница после отклика.
    tags: [scenario, dynamic, irreversible]
    needs_login: true
    max_steps: 40
    expect:
      success: true
      mentions: ["откликнул"]
      forbid_errors: [crash]

  - id: mail_spam
    task: >-
      Открой Яндекс.Почту, просмотри входящие и удали письма, которые выглядят
      как спам или рекламная рассылка. Перед удалением перечисли, что удаляешь.
    tags: [scenario, destructive]
    needs_login: true
    max_steps: 45
    expect:
      success: true
      forbid_errors: [crash]
